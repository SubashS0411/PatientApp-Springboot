spring.application.name=student-app
spring.datasource.url=jdbc:mysql://localhost:3306/Patientapp
spring.datasource.username=root
spring.datasource.password=1234

# 2. Hibernate Magic: "update" means Spring will automatically create/update tables for you!
spring.jpa.hibernate.ddl-auto=update

# 3. Show the actual SQL queries in the IntelliJ console (Great for interviews/debugging)
spring.jpa.show-sql=true
# Reveal error messages to the client
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
server.port=4000
logging.level.root=info